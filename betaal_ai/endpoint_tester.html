<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betaal AI | API Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #000000;
            --bg: #ffffff;
            --text-main: #000000;
            --text-dim: #64748b;
            --border-thick: 2px solid #000000;
            --border-thin: 1px solid #e2e8f0;
            --accent: #3b82f6;
            --bg-alt: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4rem;
            padding: 1.5rem 0;
            border-bottom: var(--border-thick);
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo::before {
            content: '';
            width: 12px;
            height: 12px;
            background: #000;
            display: inline-block;
        }

        .base-url-config {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .base-url-config label {
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-dim);
        }

        .base-url-config input {
            border: 1px solid #000;
            padding: 0.5rem 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            outline: none;
            width: 300px;
            background: transparent;
        }

        .tab-bar {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 3rem;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 0.5rem;
            overflow-x: auto;
            white-space: nowrap;
        }

        .tab {
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            color: var(--text-dim);
            padding: 0.5rem 0;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
        }

        .tab:hover {
            color: #000;
        }

        .tab.active {
            color: #000;
            border-bottom: 2px solid #000;
        }

        .section-group {
            margin-bottom: 3rem;
        }

        .section-header {
            display: none; /* Hidden because tabs show the group now */
        }

        .api-list {
            display: flex;
            flex-direction: column;
            gap: 4rem;
        }

        .endpoint-card {
            border: 1px solid transparent;
            padding: 0;
            transition: all 0.2s;
        }

        .endpoint-main {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 3rem;
        }

        @media (max-width: 1000px) {
            .endpoint-main { grid-template-columns: 1fr; gap: 2rem; }
        }

        .endpoint-meta {
            margin-bottom: 1.5rem;
        }

        .endpoint-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .method {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 0.7rem;
            padding: 0.2rem 0.6rem;
            border: 1px solid currentColor;
            min-width: 60px;
            text-align: center;
            border-radius: 2px;
        }

        .method.GET { color: #10b981; }
        .method.POST { color: #3b82f6; }
        .method.PUT { color: #f59e0b; }

        .path {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 600;
            color: #000;
        }

        .description {
            color: var(--text-dim);
            font-size: 0.9rem;
            font-weight: 400;
        }

        .input-section h4, .output-section h4 {
            font-size: 0.65rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
            color: #000;
            text-transform: uppercase;
            opacity: 0.5;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .field-row {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .field-row label {
            font-size: 0.7rem;
            font-weight: 700;
            color: #000;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
        }

        .field-row input {
            border: 1px solid #e2e8f0;
            padding: 0.75rem;
            font-size: 0.9rem;
            outline: none;
            width: 100%;
            font-family: 'JetBrains Mono', monospace;
            transition: border-color 0.2s;
        }

        .field-row input:focus {
            border-color: #000;
        }

        .json-box {
            border: 1px solid #e2e8f0;
            padding: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            background: #fafafa;
            height: 180px;
            width: 100%;
            resize: vertical;
            outline: none;
        }

        .json-box:focus {
            border-color: #000;
        }

        .toggle-json {
            font-size: 0.65rem;
            font-weight: 700;
            text-decoration: underline;
            cursor: pointer;
            margin-bottom: 0.5rem;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .test-btn {
            margin-top: 1rem;
            background: #000;
            color: #fff;
            border: none;
            padding: 1rem 2rem;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            width: fit-content;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: opacity 0.2s;
        }

        .test-btn:hover { opacity: 0.8; }

        .google-mock {
            border: 1px solid #000;
            padding: 0.75rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            width: 100%;
            margin-bottom: 1rem;
            justify-content: center;
        }

        .output-section {
            background: #fdfdfd;
            border: 1px solid #e2e8f0;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            min-height: 300px;
        }

        .status-info {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            margin-bottom: 1rem;
            padding: 0.5rem;
            background: #000;
            color: #fff;
            width: fit-content;
        }

        .response-container {
            flex-grow: 1;
            overflow: auto;
            position: relative;
        }

        .response-pre {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            white-space: pre-wrap;
            color: #1e293b;
        }

        .hidden { display: none; }

        i { color: var(--text-dim); font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">BETAAL.DEV</div>
            <div class="base-url-config">
                <label>ENVIRONMENT</label>
                <input type="text" id="baseUrl" value="http://localhost:8000">
            </div>
        </header>

        <div id="tabTarget" class="tab-bar">
            <!-- Tabs injected here -->
        </div>

        <div id="renderTarget">
            <!-- Content injected here -->
        </div>
    </div>

    <script>
        const endpoints = [
            // Auth
            { group: 'auth', method: 'POST', path: '/auth/verify', desc: 'Verify user session token', body: { id_token: 'demo_token_123' }, google: true },
            { group: 'auth', method: 'POST', path: '/auth/login', desc: 'User authentication login', body: { email: 'Yash.demo@gmail.com', password: 'password123' }, google: true },
            { group: 'auth', method: 'POST', path: '/auth/logout', desc: 'Terminate user session', body: { uid: 'demo_user_001', session_token: 'sess_abc123' } },
            
            // User
            { group: 'user', method: 'GET', path: '/user/profile', desc: 'Retrieve full user profile', query: ['uid=demo_user_001'] },
            { group: 'user', method: 'PUT', path: '/user/profile', desc: 'Update user profile attributes', body: { uid: 'demo_user_001', name: 'Yash Updated', age: 20, addiction_level: 8, strictness: 3 } },
            { group: 'user', method: 'GET', path: '/user/list', desc: 'Fetch accounts linked for monitoring', query: ['uid=demo_user_001'] },
            { group: 'user', method: 'GET', path: '/user/{user_id}/stats', desc: 'Generic user usage statistics', params: { '{user_id}': 'demo_user_001' } },
            { group: 'user', method: 'POST', path: '/user/link', desc: 'Establish parent-child link', body: { parent_uid: 'demo_parent_001', child_uid: 'demo_user_001', relation: 'child', link_code: 'LINK123' } },
            
            // Usage
            { group: 'usage', method: 'POST', path: '/usage/log', desc: 'Submit raw app usage events', body: { uid: 'demo_user_001', events: [{app_name: 'Instagram', category: 'Social', start: '2025-01-14T10:00:00Z', end: '2025-01-14T10:15:00Z'}] } },

            { group: 'usage', method: 'GET', path: '/usage/stats', desc: 'Detailed analytics breakdown', query: ['uid=demo_user_001'] },
            { group: 'usage', method: 'GET', path: '/usage/heatmap', desc: 'Time-block intensity data', query: ['uid=demo_user_001'] },
            { group: 'usage', method: 'GET', path: '/usage/summary', desc: 'Quick consumption summary', query: ['uid=demo_user_001'] },
            
            // AI & Chat
            { group: 'ai', method: 'POST', path: '/chat', desc: 'Live interaction with Betaal AI', body: { uid: 'demo_user_001', message: 'I need help reducing screen time', session_id: 'sess_123' } },
            { group: 'ai', method: 'POST', path: '/ai/evaluate', desc: 'Risk classification analysis', body: { uid: 'demo_user_001' } },
            { group: 'ai', method: 'POST', path: '/youtube/recommend', desc: 'Productive video suggestions', body: { uid: 'demo_user_001', prompt: 'productivity', topics: ['coding'], keywords: ['python', 'ai'] } },
            
            // Monitoring
            { group: 'monitor', method: 'GET', path: '/monitor/{child_id}/stats', desc: 'Parental dashboard view', params: { '{child_id}': 'demo_user_001' } },
            { group: 'monitor', method: 'PUT', path: '/monitor/{child_id}/strictness', desc: 'Adjust enforcement level', params: { '{child_id}': 'demo_user_001' }, body: { parent_uid: 'demo_parent_001', new_strictness: 5 } },
            
            // Rehab & Reports
            { group: 'rehab', method: 'GET', path: '/rehab/plan', desc: 'Current phased rehab strategy', query: ['uid=demo_user_001'] },
            { group: 'rehab', method: 'POST', path: '/rehab/recalculate', desc: 'Trigger plan recalculation', body: { uid: 'demo_user_001', addiction_level: 8, strictness: 4 } },
            { group: 'rehab', method: 'GET', path: '/report/daily', desc: 'End-of-day productivity report', query: ['uid=demo_user_001'] },
            { group: 'rehab', method: 'GET', path: '/report/weekly', desc: 'Seven-day trend analysis', query: ['uid=demo_user_001'] },
            
            // Extension & System
            { group: 'extension', method: 'POST', path: '/extension/heartbeat', desc: 'Extension sync & rule check', body: { uid: 'demo_user_001', today_browser_sec: 2700, domains: [{domain: 'youtube.com', seconds: 1200}] } },
            { group: 'extension', method: 'POST', path: '/extension/cooldown', desc: 'Fetch randomized 2D interruption array', body: { uid: 'demo_user_001', daily_limit_sec: 1800, num_effects: 4 } },
            { group: 'system', method: 'GET', path: '/dashboard', desc: 'Aggregated ecosystem view', query: ['uid=demo_user_001'] },
            { group: 'system', method: 'GET', path: '/features', desc: 'Active feature directory' },
            { group: 'system', method: 'GET', path: '/health', desc: 'Backend health heartbeat' }
        ];

        let activeTab = 'auth';

        function renderTabs() {
            const tabTarget = document.getElementById('tabTarget');
            tabTarget.innerHTML = '';
            const groups = [...new Set(endpoints.map(ep => ep.group))];
            
            groups.forEach(group => {
                const tab = document.createElement('div');
                tab.className = `tab ${group === activeTab ? 'active' : ''}`;
                tab.innerText = group;
                tab.onclick = () => {
                    activeTab = group;
                    renderTabs();
                    renderEndpoints();
                };
                tabTarget.appendChild(tab);
            });
        }

        function renderEndpoints() {
            const target = document.getElementById('renderTarget');
            target.innerHTML = '';
            
            const filtered = endpoints.filter(ep => ep.group === activeTab);
            
            const currentSection = document.createElement('div');
            currentSection.className = 'section-group';
            
            const currentList = document.createElement('div');
            currentList.className = 'api-list';
            currentSection.appendChild(currentList);
            target.appendChild(currentSection);

            filtered.forEach((ep) => {
                const i = endpoints.indexOf(ep);
                const card = document.createElement('div');
                card.className = 'endpoint-card';
                card.id = `ep-${i}`;
                
                let inputs = '';
                if (ep.google) inputs += `<div class="google-mock">Continue with Google</div>`;
                if (ep.params) Object.entries(ep.params).forEach(([k, v]) => inputs += `<div class="field-row"><label>${k}</label><input type="text" data-type="param" data-key="${k}" value="${v}"></div>`);
                if (ep.query) ep.query.forEach(q => { const [k, v] = q.split('='); inputs += `<div class="field-row"><label>${k}</label><input type="text" data-type="query" data-key="${k}" value="${v}"></div>`});
                
                if (ep.body) {
                    inputs += `
                        <div class="field-row">
                            <span class="toggle-json" onclick="document.getElementById('json-${i}').classList.toggle('hidden')">Edit JSON Body</span>
                            <textarea id="json-${i}" class="json-box hidden" data-type="body">${JSON.stringify(ep.body, null, 2)}</textarea>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="endpoint-meta">
                        <div class="endpoint-header">
                            <span class="method ${ep.method}">${ep.method}</span>
                            <span class="path">${ep.path}</span>
                        </div>
                        <div class="description">${ep.desc}</div>
                    </div>
                    
                    <div class="endpoint-main">
                        <div class="input-section">
                            <h4>Parameters</h4>
                            <div class="input-group">${inputs || '<i>No parameters required</i>'}</div>
                            <button class="test-btn" onclick="run(${i})">Execute Request</button>
                        </div>
                        <div class="output-section">
                            <h4>Response</h4>
                            <div id="status-${i}" class="status-info hidden"></div>
                            <div class="response-container">
                                <pre id="output-${i}" class="response-pre">/* Waiting for execution... */</pre>
                            </div>
                        </div>
                    </div>
                `;
                currentList.appendChild(card);
            });
        }

        async function run(i) {
            const ep = endpoints[i];
            const base = document.getElementById('baseUrl').value.replace(/\/$/, '');
            const card = document.getElementById(`ep-${i}`);
            const out = document.getElementById(`output-${i}`);
            const stat = document.getElementById(`status-${i}`);
            
            out.innerText = 'Sending request...';
            stat.classList.add('hidden');

            let path = ep.path;
            const query = new URLSearchParams();
            let body = null;

            card.querySelectorAll('input, textarea').forEach(el => {
                const type = el.getAttribute('data-type');
                if (type === 'param') path = path.replace(el.getAttribute('data-key'), encodeURIComponent(el.value));
                if (type === 'query') query.append(el.getAttribute('data-key'), el.value);
                if (type === 'body') body = el.value;
            });

            const url = `${base}${path}${query.toString() ? '?' + query.toString() : ''}`;

            try {
                const startTime = performance.now();
                const r = await fetch(url, {
                    method: ep.method,
                    headers: { 'Content-Type': 'application/json' },
                    body: ep.method !== 'GET' ? body : undefined
                });
                const d = await r.json();
                const endTime = performance.now();
                
                stat.innerText = `${r.status} ${r.statusText} • ${Math.round(endTime - startTime)}ms`;
                stat.classList.remove('hidden');
                out.innerText = JSON.stringify(d, null, 2);
            } catch (e) {
                out.innerText = `ERROR: ${e.message}`;
            }
        }

        renderTabs();
        renderEndpoints();
    </script>
</body>
</html>
